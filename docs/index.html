<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tienda de Autos</title>
  <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
  <header class="container">
    <h1>Tienda de Autos</h1>
  </header>

  <main class="container">
    <section class="filters">
      <div class="field">
        <label for="q">Buscar por marca o modelo</label>
        <input id="q" name="q" type="text" placeholder="Ej. Toyota o Corolla" autocomplete="off">
      </div>
      <div class="field">
        <label>Rango de precio</label>
        <div class="range-group">
          <input id="minRange" name="minRange" type="range">
          <input id="maxRange" name="maxRange" type="range">
        </div>
        <div class="range-labels">
          <span id="minVal">$0</span>
          <span id="maxVal">$0</span>
        </div>
      </div>
      <button id="clearBtn" class="btn" type="button">Limpiar filtros</button>
    </section>

    <section>
      <div id="resultsMeta" class="results-meta"></div>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <footer class="container footer">
    <small>Las imágenes utilizadas pertenecen a sus respectivos propietarios y se emplean con fines exclusivamente educativos. Esta es una página de demostración. Todos los derechos reservados.</small>
  </footer>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
